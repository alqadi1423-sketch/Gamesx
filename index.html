<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ألعابنا</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#EC6158;--blue:#4AB1E8;--ink:#2D4763;--bg:#E9F1FA;--mut:#7F95AD;--line:#d3e0ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2',system-ui,sans-serif}
#app{max-width:540px;margin:0 auto;padding:14px 14px 48px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:disabled{cursor:default}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.top h1{font-size:26px;margin:0;font-weight:800;flex:1;line-height:1.2}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font-size:42px;margin:6px 0 0;font-weight:800}
.hero p{margin:0;color:var(--mut);font-size:18px}
.big{display:block;width:100%;padding:16px 18px;border-radius:22px;font-size:21px;font-weight:800;color:#fff;margin:14px 0;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.big:disabled{opacity:.5}
.big small{display:block;font-size:14px;font-weight:500;opacity:.9}
.red{background:var(--red)} .blue{background:var(--blue)} .navy{background:var(--ink)}
.panel{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 3px 0 var(--line)}
.panel h3{margin:0;font-size:20px} .panel p{margin:2px 0 0;color:var(--mut)}
.panel .big{margin-bottom:4px}
input.code{width:100%;margin-top:10px;font:inherit;font-size:30px;font-weight:800;text-align:center;letter-spacing:10px;padding:8px;border:3px solid var(--line);border-radius:16px;color:var(--ink);text-transform:uppercase;direction:ltr}
input.code:focus{outline:none;border-color:var(--blue)}
.err{color:#c0392b;text-align:center;font-weight:700}
.note{color:var(--mut);text-align:center;font-size:15px;margin:6px 0}
.link{background:none;color:var(--blue);font-weight:800;font-size:18px;display:block;margin:8px auto;text-decoration:underline}
.roombar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:8px 12px;margin-bottom:12px;box-shadow:0 3px 0 var(--line);font-size:15px}
.roombar .code{font-size:20px;letter-spacing:3px;direction:ltr;display:inline-block}
.roombar .sp{flex:1}
.chip{padding:1px 9px;border-radius:99px;font-weight:700;font-size:13px;color:#fff;display:inline-block}
.sm{padding:6px 14px;border-radius:12px;background:var(--bg);font-weight:700;font-size:15px}
.sm.go{background:var(--ink);color:#fff}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;background:#fff;border-radius:18px;padding:8px;margin-bottom:12px;box-shadow:0 3px 0 var(--line);font-weight:700}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:24px;font-weight:800}
.stepper b{font-size:26px;min-width:28px;text-align:center}
.dotsrow{display:flex;gap:4px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.dotsrow i{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:#fff;border-radius:26px;padding:7px;box-shadow:0 4px 0 var(--line);position:relative;display:block;width:100%}
.gcard svg{display:block;width:100%;border-radius:20px}
.gcard .lb{position:absolute;left:14px;right:14px;bottom:14px;border-radius:16px;padding:6px 4px;font-weight:800;font-size:18px;color:#fff}
.score{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 6px;border-radius:99px;color:#fff;font-weight:800;font-size:14px}
.pl b{font-size:19px}
.pl.on{outline:3px solid var(--ink);outline-offset:2px}
.pl.out{opacity:.35;text-decoration:line-through}
.status{text-align:center;font-size:19px;min-height:34px;margin:6px 0 12px;line-height:1.5}
.status small{color:var(--mut);font-size:15px}
.w{font-size:24px;font-weight:800;margin-left:8px}
.mini{display:inline-block;min-width:26px;border-radius:9px;color:#fff;font-weight:800;margin:0 2px;padding:0 6px;font-size:16px}
.board{display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.lbl{margin:6px 0;font-weight:700;color:var(--mut)}
.hint{color:#25834a;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.tab{padding:4px 12px;border-radius:12px;font-weight:800;color:#fff;opacity:.45;font-size:15px}
.tab.sel{opacity:1;outline:3px solid var(--ink);outline-offset:1px}
.cover{width:100%;border-radius:26px;padding:34px 20px;text-align:center;color:#fff}
.cover h2{font-size:34px;margin:4px 0}.cover p{margin:4px 0;font-size:17px}
.cover .big{background:#fff;color:var(--ink);margin-top:22px}
.cover .msg{background:rgba(255,255,255,.25);border-radius:14px;padding:8px;margin-bottom:12px;font-weight:700}
.ttt{display:grid;gap:6px;width:min(100%,400px);background:var(--ink);padding:8px;border-radius:22px}
.tc{aspect-ratio:1;background:#fff;border-radius:10px;display:grid;place-items:center;padding:14%}
.tc svg{width:100%;height:100%}
.tc.hl{background:#fff4c9}
.tc:disabled{opacity:1}
svg.dots{width:min(100%,400px);background:#fff;border-radius:24px;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
svg.dots .hit{stroke:transparent;cursor:pointer}
svg.dots .ghost{stroke:#dde6f0;stroke-dasharray:2 2;pointer-events:none}
.sl{position:relative;width:min(100%,440px);aspect-ratio:1;direction:ltr;border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.sl .cells{display:grid;grid-template-columns:repeat(10,1fr);width:100%;height:100%}
.sl .cl{display:flex;align-items:flex-start;justify-content:flex-start;padding:1px 3px;font-size:11px;font-weight:700;color:#b08a55}
.sl .cl.a{background:#FBEFD9}.sl .cl.b{background:#F3D9AE}
.sl svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rail{stroke:#8a5a2b;stroke-width:1.2;stroke-linecap:round}.rung{stroke:#8a5a2b;stroke-width:.9}
.dice{width:64px;height:64px;background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.dice svg{width:50px;height:50px}
.dice.roll{animation:sp .35s}
@keyframes sp{from{transform:rotate(-90deg) scale(.7)}to{transform:none}}
.slmsg{min-height:24px;text-align:center;font-weight:700}
.start{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--mut);font-size:14px;flex-wrap:wrap;justify-content:center}
.cw{display:grid;gap:6px;width:min(100%,420px);background:#4B3A62;padding:8px;border-radius:22px}
.cc{aspect-ratio:1;border-radius:12px;background:#EFE8DD;display:grid;place-items:center;padding:10%}
.cc.can{box-shadow:inset 0 0 0 3px rgba(255,255,255,.95)}
.cc:disabled{opacity:1}
.cc svg{width:100%;height:100%;animation:pop .25s}
@keyframes pop{from{transform:scale(.5)}to{transform:none}}
.sea{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(100%,380px);background:#2F7DB3;padding:6px;border-radius:18px}
.sea.small{width:min(62%,230px);gap:2px;padding:4px;border-radius:12px}
.sc{aspect-ratio:1;background:#4FA3D8;border-radius:5px;position:relative}
.sea.small .sc{border-radius:3px}
.sc.can{background:#5DB0E3;cursor:pointer}
.sc.ship{background:#9BB1C4}
.sc.sunk{background:#555f6b}
.sc.miss::after{content:'';position:absolute;inset:36%;border-radius:50%;background:#1d5c87}
.sc.hit{background:var(--red)}
.sc.hit::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:70%}
.gw{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:100%;background:#6E4C8B;padding:7px;border-radius:20px}
.pc{background:#fff;border-radius:10px;padding:2px 1px 1px;text-align:center;font-size:11px;font-weight:700;line-height:1.3}
.pc svg{width:100%;display:block}
.pc.out{opacity:.22;filter:grayscale(1)}
.pc.pick{cursor:pointer;box-shadow:0 0 0 3px #ffd84d}
.secret{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 12px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.secret .pc{width:56px;box-shadow:0 0 0 2px #e4daf0}
.qs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.q{background:#fff;border-radius:12px;padding:5px 12px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:14px;font-weight:700;z-index:9}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="shm" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="2" height="2" fill="#D9473F"/><rect x="2" y="2" width="2" height="2" fill="#D9473F"/></pattern>
</defs></svg>
<div id="app"></div>
<script>
'use strict';
const app=document.getElementById('app');
const MAXP=8;
const COLS=['#EC6158','#4AB1E8','#4CB97F','#EDB02F','#9C7BD6','#F2874B','#E57AAE','#2FB3AA'];
const LIGHT=['#FAD2CE','#CDEAFA','#D0EFDD','#FBEAC2','#E5DAF6','#FCDCC6','#F8D5E7','#C9EEEA'];
const NAMES=['الأحمر','الأزرق','الأخضر','الأصفر','البنفسجي','البرتقالي','الوردي','الفيروزي'];
const rid=()=>Math.random().toString(36).slice(2,8);
const rnd=n=>Math.floor(Math.random()*n);
const setAt=(s,i,c)=>s.slice(0,i)+c+s.slice(i+1);
const BACK='<svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PERSON='<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="8" r="5" fill="#fff"/><path d="M3 23c0-6 4-9 9-9s9 3 9 9z" fill="#fff"/></svg>';

/* seats: a game has d.pl = list of roles (colours) taking part; seat i plays role d.pl[i] */
const col=(d,s)=>COLS[d.pl[s]],lit=(d,s)=>LIGHT[d.pl[s]],nm=(d,s)=>NAMES[d.pl[s]];
const nameTag=(d,s)=>`<b style="color:${col(d,s)}">${nm(d,s)}</b>`;
function nextSeat(d,from,out){out=out||d.out;const n=d.pl.length;for(let k=1;k<=n;k++){const s=(from+k)%n;if(out[s]!=='1')return s;}return from;}
const aliveSeats=(d,out)=>{out=out||d.out;return d.pl.map((_,s)=>s).filter(s=>out[s]!=='1');};

/* ================= state ================= */
const S={mode:null,localN:2,st:{g:null,s:0,d:null,sc:Array(MAXP).fill(0)},me:null,myPeer:null,code:null,nr:null,roles:new Set(),priv:Array(MAXP).fill(null),seen:null,roomErr:null,joining:false,gw:false,rolled:false,tgt:null,pending:false};
const GAMES={};

function players(){
  if(S.mode==='local')return [...Array(S.localN).keys()];
  return [...S.roles].filter(r=>typeof r==='number'&&r>=0&&r<MAXP).sort((a,b)=>a-b);
}
function newD(g,starter,pl){const n=pl.length;starter=starter%n;return {...GAMES[g].init(n),gid:rid(),st:starter,turn:starter,pl,out:'0'.repeat(n),win:null};}
function setGame(g){
  if(g){const pl=players();if(pl.length<2){toast('تحتاجون لاعبين اثنين على الأقل');return;}
    S.st={...S.st,g,s:S.st.s+1,d:newD(g,0,pl),sc:Array(MAXP).fill(0)};}
  else S.st={...S.st,g:null,s:S.st.s+1,d:null};
  S.seen=null;S.gw=false;S.tgt=null;afterChange();
}
function newRound(){const d=S.st.d;const pl=players();if(pl.length<2){toast('تحتاجون لاعبين اثنين على الأقل');return;}
  const st=d?(d.st||0)+1:0;S.st={...S.st,s:S.st.s+1,d:newD(S.st.g,st,pl)};S.seen=null;S.gw=false;S.tgt=null;afterChange();}
function act(nd){const was=S.st.d&&S.st.d.win!=null;const sc=[...S.st.sc];if(!was&&typeof nd.win==='number')sc[nd.pl[nd.win]]++;S.st={...S.st,s:S.st.s+1,d:nd,sc};afterChange();}
function setPriv(role,p){S.priv[role]=p;afterChange();}
function afterChange(){ensurePriv();publish();render();}
function ensurePriv(){
  const {g,d}=S.st;if(!g||!d)return;const G=GAMES[g];if(!G||!G.privInit)return;
  const roles=S.mode==='local'?d.pl:(S.me==null||!d.pl.includes(S.me)?[]:[S.me]);
  for(const r of roles){const p=S.priv[r];if(!p||p.gid!==d.gid)S.priv[r]={...G.privInit(d),gid:d.gid};}
}
function publish(){
  save();if(S.mode!=='online'||!S.nr)return;
  S.nr.presence({g:S.st.g,s:S.st.s,d:S.st.d,sc:S.st.sc,r:S.me,p:S.me==null?null:S.priv[S.me]}).catch(e=>console.warn('presence',e));
}
const LS='alaabna.v2';
function save(){if(S.mode!=='online'||!S.code)return;try{localStorage.setItem(LS,JSON.stringify({code:S.code,me:S.me,st:S.st,priv:S.me==null?null:S.priv[S.me]}));}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem(LS)||'null');}catch(e){return null;}}

/* ================= room ================= */
let roomP=null;
function getRoom(){
  if(!roomP)roomP=(async()=>{
    for(let k=0;k<40&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
    if(!(window.claude&&window.claude.use))return null;
    try{return await window.claude.use('room');}catch(e){return null;}
  })();
  return roomP;
}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[rnd(A.length)];return c;}
let lastPeers=[];
function takenRoles(){const t=new Set();for(const p of lastPeers){if(p.sameTab||p.kind!=='viewer')continue;const r=(p.presence||{}).r;if(typeof r==='number')t.add(r);}return t;}
function pickRole(pref){const t=takenRoles();if(typeof pref==='number'&&pref>=0&&pref<MAXP&&!t.has(pref))return pref;for(let r=1;r<MAXP;r++)if(!t.has(r))return r;return t.has(0)?null:0;}
async function enterRoom(code,host,restore){
  S.joining=true;S.roomErr=null;render();
  const room=await getRoom();
  if(!room){S.joining=false;S.roomErr='اللعب أونلاين يشتغل لما تفتح الصفحة من claude.ai وأنت مسجّل دخول.';render();return;}
  let nr;
  try{nr=await room.join('g-'+code.toLowerCase());}
  catch(e){S.joining=false;S.roomErr='ما قدرت أدخل الغرفة، جرّب مرة ثانية.';render();return;}
  S.mode='online';S.code=code;S.nr=nr;S.joining=false;S.priv=Array(MAXP).fill(null);S.seen=null;S.roles=new Set();lastPeers=[];
  if(restore&&restore.st){S.st=restore.st;if(!Array.isArray(S.st.sc)||S.st.sc.length<MAXP)S.st.sc=Array(MAXP).fill(0);}
  else S.st={g:null,s:host?1:0,d:null,sc:Array(MAXP).fill(0)};
  if(host){S.me=0;S.pending=false;}
  else{S.me=null;S.pending=true;
    setTimeout(()=>{if(S.nr!==nr)return;S.me=pickRole(restore?restore.me:null);if(S.me!=null&&restore&&restore.me===S.me)S.priv[S.me]=restore.priv||null;S.pending=false;recomputeRoles();afterChange();},1500);}
  nr.onPeers(onPeers,()=>{S.roomErr='انقطع الاتصال بالغرفة.';render();});
  afterChange();
}
function recomputeRoles(){const s=new Set();if(S.me!=null)s.add(S.me);for(const p of lastPeers){if(p.sameTab||p.kind!=='viewer')continue;const r=(p.presence||{}).r;if(typeof r==='number')s.add(r);}S.roles=s;}
function onPeers(ch){
  if(S.mode!=='online')return;
  lastPeers=ch.peers;let adopt=null;
  for(const p of ch.peers){
    if(p.sameTab){S.myPeer=p.peer;continue;}
    if(p.kind!=='viewer')continue;const pr=p.presence||{};
    if(typeof pr.r==='number')S.priv[pr.r]=pr.p??S.priv[pr.r];
    if(S.me!=null&&pr.r===S.me&&String(p.peer)<String(S.myPeer)){S.me=pickRole(null);}
    if(typeof pr.s!=='number')continue;
    const better=pr.s>S.st.s||(pr.s===S.st.s&&pr.r===0&&S.me!==0&&JSON.stringify(pr.d??null)!==JSON.stringify(S.st.d));
    if(better&&(!adopt||pr.s>adopt.s))adopt=pr;
  }
  recomputeRoles();
  if(adopt){
    const oldGid=S.st.d&&S.st.d.gid,oldG=S.st.g;
    S.st={g:adopt.g??null,s:adopt.s,d:adopt.d??null,sc:Array.isArray(adopt.sc)?adopt.sc:Array(MAXP).fill(0)};
    if(S.st.g!==oldG||(S.st.d&&S.st.d.gid)!==oldGid){S.gw=false;S.tgt=null;}
    ensurePriv();publish();
  }
  render();
}

/* ================= helpers ================= */
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
function mySeat(d){return S.mode==='local'?null:d.pl.indexOf(S.me);}
function mkCtx(){
  const d=S.st.d,G=GAMES[S.st.g],local=S.mode==='local';
  const v=local?(G.viewer?G.viewer(d,S.priv):d.turn):d.pl.indexOf(S.me);
  const extra=G.canAct?G.canAct(d,S.priv):true;
  return {local,v,priv:S.priv,my:d.win==null&&extra&&(local||d.turn===v)};
}
function turnTxt(d,ctx){
  if(!ctx.local&&d.turn===ctx.v)return '<b>دورك</b>';
  return `دور ${nameTag(d,d.turn)}`;
}
function statusHTML(d,G,ctx){
  if(d.win!=null){
    const t=d.win==='d'?'تعادل!':(!ctx.local&&d.win===ctx.v?'فزت! 🎉':`فاز ${nm(d,d.win)}!`);
    const c=typeof d.win==='number'?col(d,d.win):'var(--ink)';
    return `<span class="w" style="color:${c}">${t}</span> <button class="sm go" data-a="again">جولة جديدة</button>`+(G.winExtra?`<br><small>${G.winExtra(d,ctx)}</small>`:'');
  }
  let s=G.status?G.status(d,ctx):turnTxt(d,ctx);
  if(!ctx.local&&ctx.v<0)s+='<br><small>تتفرج الحين، وتدخل معهم في الجولة الجاية</small>';
  if(!ctx.local&&!S.roles.has(d.pl[d.turn]))s+=`<br><small>${nm(d,d.turn)} طلع من الغرفة</small> <button class="sm" data-a="skip">تخطّاه</button>`;
  return s;
}

/* ================= screens ================= */
function render(){
  if(S.mode===null)return renderHome();
  if(S.mode==='lobby')return renderLobby();
  if(!S.st.g||!GAMES[S.st.g]||!S.st.d)return renderGrid();
  renderGame();
}
function renderHome(){
  app.innerHTML=`<div class="hero">${LOGO}<h1>ألعابنا</h1><p>من لاعبين اثنين إلى ${MAXP} لاعبين</p></div>
  <button class="big red" data-a="local">على نفس الجهاز<small>كلكم على جوال واحد</small></button>
  <button class="big blue" data-a="lobby">أونلاين<small>كل واحد من جهازه برمز غرفة</small></button>`;
}
function renderLobby(){
  const sv=loadSaved();
  app.innerHTML=`<div class="top"><button class="ib" data-a="home">${BACK}</button><h1>أونلاين</h1></div>
  <div class="panel"><h3>أنشئ غرفة</h3><p>تاخذ رمز وترسله لأصحابك، وتكون أنت الأحمر</p><button class="big red" data-a="create" ${S.joining?'disabled':''}>أنشئ غرفة</button></div>
  <div class="panel"><h3>ادخل غرفة</h3><p>اكتب الرمز اللي وصلك</p><input class="code" id="code" maxlength="4" autocomplete="off" placeholder="····"><button class="big blue" data-a="join" ${S.joining?'disabled':''}>ادخل</button></div>
  ${sv&&sv.code?`<button class="link" data-a="resume">ارجع لغرفتك ${sv.code}</button>`:''}

app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-ga]');if(!t||t.disabled)return;
  const i=t.dataset.i!=null?+t.dataset.i:null;
  if(t.dataset.ga){const G=GAMES[S.st.g];if(G&&S.st.d)G.click(t.dataset.ga,i,S.st.d,mkCtx());return;}
  switch(t.dataset.a){
    case 'home':S.mode=null;render();break;
    case 'local':S.mode='local';S.me=null;S.st={g:null,s:0,d:null,sc:Array(MAXP).fill(0)};S.priv=Array(MAXP).fill(null);S.seen=null;render();break;
    case 'inc':S.localN=Math.min(MAXP,S.localN+1);render();break;
    case 'dec':S.localN=Math.max(2,S.localN-1);render();break;
    case 'lobby':S.mode='lobby';S.roomErr=null;render();getRoom();break;
    case 'create':enterRoom(genCode(),true,null);break;
    case 'join':{
      const c=(document.getElementById('code').value||'').trim().toUpperCase();
      if(!/^[A-Z0-9]{4}$/.test(c)){S.roomErr='اكتب الرمز كامل (4 خانات)';render();return;}
      const sv=loadSaved();const same=sv&&sv.code===c;
      if(same&&sv.me===0)enterRoom(c,true,sv);else enterRoom(c,false,same?sv:null);break;}
    case 'resume':{const sv=loadSaved();if(sv)enterRoom(sv.code,sv.me===0,sv);break;}
    case 'leave':if(S.nr)S.nr.leave().catch(()=>{});S.nr=null;S.mode=null;render();break;
    case 'grid':setGame(null);break;
    case 'pick':setGame(t.dataset.g);break;
    case 'again':newRound();break;
    case 'reveal':S.seen=i;S.tgt=null;render();break;
    case 'skip':{const d=S.st.d;if(!d||d.win!=null)return;const out=setAt(d.out,d.turn,'1');const al=aliveSeats(d,out);
      act({...d,out,turn:nextSeat(d,d.turn,out),win:al.length===1?al[0]:null});break;}
    case 'copy':try{navigator.clipboard.writeText(S.code).then(()=>toast('انسخ الرمز: '+S.code)).catch(()=>toast('الرمز: '+S.code));}catch(err){toast('الرمز: '+S.code);}break;
  }
});

/* ================= game: tic tac toe ================= */
const TTS={2:[3,3],3:[5,4],4:[6,4],5:[7,4],6:[7,4],7:[8,4],8:[8,4]};
function lineWin(b,sz,k){for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){const v=b[r*sz+c];if(v==='.')continue;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const cells=[];for(let j=0;j<k;j++){const rr=r+dr*j,cc=c+dc*j;if(rr<0||rr>=sz||cc<0||cc>=sz||b[rr*sz+cc]!==v)break;cells.push(rr*sz+cc);}
    if(cells.length===k)return {w:+v,ln:cells};}}return null;}
GAMES.ttt={name:'إكس أو',lbc:'#B9483F',

  init:n=>{const [sz,k]=TTS[n]||[8,4];return {sz,k,b:'.'.repeat(sz*sz),ln:null};},
  status:(d,ctx)=>turnTxt(d,ctx)+(d.pl.length>2?`<br><small>أول واحد يصف ${d.k} ورا بعض يفوز</small>`:''),
  render(d,ctx){const g=d.sz>5?4:d.sz>3?5:8;return `<div class="ttt" style="grid-template-columns:repeat(${d.sz},1fr);gap:${g}px">${[...d.b].map((c,i)=>`<button class="tc ${d.ln&&d.ln.includes(i)?'hl':''}" data-ga="m" data-i="${i}" ${c!=='.'||!ctx.my?'disabled':''}>${c!=='.'?shape(d.pl[+c]):''}</button>`).join('')}</div>`;},
  click(a,i,d,ctx){
    if(!ctx.my||d.b[i]!=='.')return;
    const b=setAt(d.b,i,String(d.turn));const r=lineWin(b,d.sz,d.k);let win=null,ln=null;

};

const cntSeat=(s,n)=>{const a=Array(n).fill(0);for(const c of s)if(c!=='.')a[+c]++;return a;};
GAMES.dots={name:'نقاط ومربعات',lbc:'#8F86C9',
  icon:`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#D8D2F6"/><rect x="22" y="22" width="28" height="28" fill="#F6B3AC"/><path d="M22 22H50V50H22Z" stroke="#EC6158" stroke-width="4" fill="none"/><path d="M50 50H78M78 22V50" stroke="#4AB1E8" stroke-width="4"/>${[22,50,78].map(y=>[22,50,78].map(x=>`<circle cx="${x}" cy="${y}" r="5" fill="#2D4763"/>`).join('')).join('')}</svg>`,
  init:n=>{const B=n===2?4:n<=4?5:6;return {B,h:'.'.repeat((B+1)*B),v:'.'.repeat(B*(B+1)),bx:'.'.repeat(B*B)};},
  status(d,ctx){const c=cntSeat(d.bx,d.pl.length);return `${turnTxt(d,ctx)}<br>${c.map((x,s)=>`<span class="mini" style="background:${col(d,s)}">${x}</span>`).join('')}`;},

    for(let r=0;r<B;r++)for(let c=0;c<B;c++){const o=d.bx[r*B+c];if(o!=='.')bx+=`<rect x="${P(c)}" y="${P(r)}" width="${st}" height="${st}" fill="${lit(d,+o)}"/>`;}
    const seg=(x1,y1,x2,y2,val,a,i)=>{
      if(val!=='.')return [false,`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col(d,+val)}" stroke-width="${sw}" stroke-linecap="round"/>`];
      return [true,`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ghost" stroke-width="1.4"/>`+(ctx.my?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="hit" stroke-width="${hw}" data-ga="${a}" data-i="${i}"/>`:'')];};
    const add=([e,s])=>{if(e)hits+=s;else lines+=s;};
    for(let r=0;r<=B;r++)for(let c=0;c<B;c++){const k=r*B+c;add(seg(P(c),P(r),P(c+1),P(r),d.h[k],'h',k));}
    for(let r=0;r<B;r++)for(let c=0;c<=B;c++){const k=r*(B+1)+c;add(seg(P(c),P(r),P(c),P(r+1),d.v[k],'v',k));}
    for(let r=0;r<=B;r++)for(let c=0;c<=B;c++)dots+=`<circle cx="${P(c)}" cy="${P(r)}" r="${B>4?1.9:2.3}" fill="#2D4763" pointer-events="none"/>`;
    return `<svg class="dots" viewBox="0 0 100 100">${bx}${hits}${lines}${dots}</svg><p class="note">اضغط بين نقطتين ترسم خط. تقفل مربع؟ تلعب مرة ثانية</p>`;
  },
  click(a,i,d,ctx){
    if(!ctx.my)return;let {h,v,bx}=d;const B=d.B,t=String(d.turn);
    if(a==='h'){if(h[i]!=='.')return;h=setAt(h,i,t);}else{if(v[i]!=='.')return;v=setAt(v,i,t);}
    let got=false;
    for(let r=0;r<B;r++)for(let c=0;c<B;c++){const k=r*B+c;if(bx[k]!=='.')continue;
      if(h[r*B+c]!=='.'&&h[(r+1)*B+c]!=='.'&&v[r*(B+1)+c]!=='.'&&v[r*(B+1)+c+1]!=='.'){bx=setAt(bx,k,t);got=true;}}
    let win=null;if(!bx.includes('.')){const n=cntSeat(bx,d.pl.length);const mx=Math.max(...n);const top=n.map((x,s)=>x===mx?s:-1).filter(s=>s>=0);win=top.length===1?top[0]:'d';}
    act({...d,h,v,bx,turn:got?d.turn:nextSeat(d,d.turn),win});

};

/* ================= game: snakes and ladders ================= */
const LAD={4:25,13:46,33:49,42:63,50:69,62:81,74:92},SNK={27:5,40:3,43:18,54:31,66:45,76:58,89:53,99:41};
const cellXY=n=>{const r=Math.floor((n-1)/10),c=r%2===0?(n-1)%10:9-(n-1)%10;return [c*10+5,(9-r)*10+5];};
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
const diceSVG=n=>`<svg viewBox="0 0 100 100">${(PIPS[n]||[]).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="#2D4763"/>`).join('')}</svg>`;
function ladderSVG(a,b){const [x1,y1]=cellXY(a),[x2,y2]=cellXY(b);const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*2,ny=dx/L*2;
  let s=`<line class="rail" x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}"/><line class="rail" x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}"/>`;
  const k=Math.max(2,Math.floor(L/3.5));for(let j=1;j<k;j++){const t=j/k,x=x1+dx*t,y=y1+dy*t;s+=`<line class="rung" x1="${x+nx}" y1="${y+ny}" x2="${x-nx}" y2="${y-ny}"/>`;}return s;}
const SC=['#5CC08C','#E8746B','#9C7BD6','#F2A93B'];
function snakeSVG(a,b,k){const [x1,y1]=cellXY(a),[x2,y2]=cellXY(b);const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*5,ny=dx/L*5;const c=SC[k%4];
  const p=`M${x1} ${y1} C ${x1+dx*.33+nx} ${y1+dy*.33+ny}, ${x1+dx*.66-nx} ${y1+dy*.66-ny}, ${x2} ${y2}`;
  return `<path d="${p}" stroke="#2D4763" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="${p}" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="2.6" fill="${c}" stroke="#2D4763" stroke-width=".6"/><circle cx="${x1-.9}" cy="${y1-.6}" r=".7" fill="#fff"/><circle cx="${x1+.9}" cy="${y1-.6}" r=".7" fill="#fff"/>`;}
GAMES.snakes={name:'السلم والثعبان',lbc:'#A8743F',
  icon:`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#FBEFD9"/><path d="M0 0H33V33H0ZM66 0H100V33H66ZM33 33H66V66H33ZM0 66H33V100H0ZM66 66H100V100H66Z" fill="#F3D9AE"/><path d="M60 8L80 70M70 6L90 68" stroke="#8a5a2b" stroke-width="4"/><path d="M63 20L74 17M66 32L78 29M70 44L82 41M74 56L86 53" stroke="#8a5a2b" stroke-width="3"/><path d="M22 22C40 35 6 50 26 70" stroke="#2D4763" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M22 22C40 35 6 50 26 70" stroke="#5CC08C" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="22" cy="22" r="8" fill="#5CC08C" stroke="#2D4763" stroke-width="2.5"/><circle cx="19" cy="20" r="2" fill="#fff"/><circle cx="25" cy="20" r="2" fill="#fff"/><circle cx="40" cy="84" r="7" fill="#EC6158" stroke="#2D4763" stroke-width="2.5"/><circle cx="58" cy="84" r="7" fill="#4AB1E8" stroke="#2D4763" stroke-width="2.5"/></svg>`,
  init:n=>({pos:Array(n).fill(0),dice:0,msg:''}),
  render(d,ctx){
    let cells='';for(let row=9;row>=0;row--)for(let c=0;c<10;c++){const n=row%2===0?row*10+c+1:row*10+(9-c)+1;cells+=`<div class="cl ${(row+c)%2?'b':'a'}">${n}</div>`;}
    let ov=Object.entries(LAD).map(([a,b])=>ladderSVG(+a,b)).join('')+Object.entries(SNK).map(([a,b],k)=>snakeSVG(+a,b,k)).join('');
    const r=d.pl.length>4?2.4:3.1;
    d.pos.forEach((p,s)=>{if(p>0&&d.out[s]!=='1'){const [x,y]=cellXY(p);const same=d.pos.map((q,k)=>q===p&&d.out[k]!=='1'?k:-1).filter(k=>k>=0);const m=same.length,j=same.indexOf(s);
      const ox=m>1?Math.cos(2*Math.PI*j/m)*2.4:0,oy=m>1?Math.sin(2*Math.PI*j/m)*2.4:0;
      ov+=`<circle cx="${x+ox}" cy="${y+1+oy}" r="${r}" fill="${col(d,s)}" stroke="#2D4763" stroke-width=".8"/>`;}});
    const off=d.pl.map((_,s)=>s).filter(s=>d.pos[s]===0&&d.out[s]!=='1');
    const anim=S.rolled;S.rolled=false;
    return `<div class="sl"><div class="cells">${cells}</div><svg viewBox="0 0 100 100">${ov}</svg></div>
      ${off.length?`<div class="start">قبل البداية: ${off.map(s=>`<span class="mini" style="background:${col(d,s)}">${nm(d,s)}</span>`).join('')}</div>`:''}
      <div class="row" style="align-items:center"><div class="dice ${anim?'roll':''}">${d.dice?diceSVG(d.dice):''}</div><button class="big" style="width:auto;margin:0;background:${col(d,d.turn)}" data-ga="roll" ${ctx.my?'':'disabled'}>ارمِ النرد</button></div>
      <div class="slmsg">${d.msg||''}</div>`;
  },
  click(a,i,d,ctx){
    if(!ctx.my)return;const r=1+rnd(6),t=d.turn;let p=d.pos[t]+r,msg;
    if(p>100){p=d.pos[t];msg=`طلع ${r}، يحتاج ${100-p} بالضبط`;}
    else if(LAD[p]){msg=`طلع ${r}، سلّم من ${p} إلى ${LAD[p]}! 🪜`;p=LAD[p];}
    else if(SNK[p]){msg=`طلع ${r}، الثعبان نزّله من ${p} إلى ${SNK[p]} 🐍`;p=SNK[p];}
    else msg=`طلع ${r}، وصل ${p}`;
    const pos=[...d.pos];pos[t]=p;const win=p===100?t:null;const extra=r===6&&win==null;
    if(extra)msg+='، ستة! يرمي مرة ثانية';
    S.rolled=true;
    act({...d,pos,dice:r,msg:`${nm(d,t)}: ${msg}`,turn:extra?t:nextSeat(d,t),win});
  }
};

/* ================= game: color wars ================= */
const CWS={2:5,3:6,4:6,5:7,6:7,7:8,8:8};
const NB=(i,Z)=>{const r=Math.floor(i/Z),c=i%Z,o=[];if(r>0)o.push(i-Z);if(r<Z-1)o.push(i+Z);if(c>0)o.push(i-1);if(c<Z-1)o.push(i+1);return o;};
const CP={1:[[50,50]],2:[[34,34],[66,66]],3:[[50,30],[31,64],[69,64]]};
function cwCell(c,n){const pts=CP[n]||[];
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${c}"/>${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#fff"/>`).join('')}${n>3?`<text x="50" y="62" text-anchor="middle" font-size="36" fill="#fff" font-weight="800">${n}</text>`:''}</svg>`;}
GAMES.cw={name:'حرب الألوان',lbc:'#4B3A62',
  icon:`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#4B3A62"/>${[0,1,2].map(r=>[0,1,2].map(c=>{const x=6+c*31,y=6+r*31;const k=(r*3+c)%4;const bg=k===0?'#FAD2CE':k===1?'#CDEAFA':'#EFE8DD';const dot=k===0?'#EC6158':k===1?'#4AB1E8':'';return `<rect x="${x}" y="${y}" width="27" height="27" rx="7" fill="${bg}"/>`+(dot?`<circle cx="${x+13.5}" cy="${y+13.5}" r="10" fill="${dot}"/><circle cx="${x+10}" cy="${y+10}" r="2.6" fill="#fff"/><circle cx="${x+17}" cy="${y+17}" r="2.6" fill="#fff"/>`:'');}).join('')).join('')}</svg>`,
  init:n=>{const Z=CWS[n]||8;return {Z,o:'.'.repeat(Z*Z),n:'0'.repeat(Z*Z),mv:Array(n).fill(0)};},
  status(d,ctx){return turnTxt(d,ctx)+(d.mv[d.turn]===0?'<br><small>أول حركة: اختر أي خانة فاضية</small>':'<br><small>اضغط على خانة من لونك، توصل 4 تنفجر</small>');},
  render(d,ctx){
    const t=String(d.turn),first=d.mv[d.turn]===0,Z=d.Z;
    return `<div class="cw" style="grid-template-columns:repeat(${Z},1fr);gap:${Z>6?4:6}px">${[...d.o].map((o,i)=>{const can=ctx.my&&(first?o==='.':o===t);
      return `<button class="cc ${can?'can':''}" style="${o!=='.'?`background:${lit(d,+o)}`:''}" data-ga="m" data-i="${i}" ${can?'':'disabled'}>${o!=='.'?cwCell(col(d,+o),+d.n[i]):''}</button>`;}).join('')}</div>`;
  },
  click(a,i,d,ctx){
    if(!ctx.my)return;const t=d.turn,ts=String(t),Z=d.Z,N=d.pl.length;const o=[...d.o],n=[...d.n].map(Number);
    if(d.mv[t]===0){if(o[i]!=='.')return;o[i]=ts;n[i]=3;}else{if(o[i]!==ts)return;n[i]++;}
    const othersMoved=d.mv.every((m,s)=>s===t||m>0||d.out[s]==='1');
    for(let g=0;g<5000;g++){
      const k=n.findIndex(x=>x>=4);if(k<0)break;
      n[k]-=4;if(n[k]===0)o[k]='.';
      for(const b of NB(k,Z)){o[b]=ts;n[b]++;}
      if(othersMoved&&o.every(c=>c==='.'||c===ts))break;
    }
    const mv=[...d.mv];mv[t]++;let out=d.out;
    for(let s=0;s<N;s++)if(out[s]!=='1'&&mv[s]>0&&!o.includes(String(s)))out=setAt(out,s,'1');
    const al=aliveSeats(d,out);const win=al.length===1?al[0]:null;
    act({...d,o:o.join(''),n:n.map(x=>Math.min(x,9)).join(''),mv,out,turn:nextSeat(d,t,out),win});
  }
};

/* ================= game: sea battle ================= */
const SHIPS=[4,3,3,2,2],SL='abcde';
function near(f,x){const r=Math.floor(x/8),c=x%8;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8&&f[rr*8+cc]!=='.')return true;}return false;}
function randFleet(){
  for(let tr=0;tr<500;tr++){const f=Array(64).fill('.');let ok=true;
    for(let s=0;s<SHIPS.length&&ok;s++){const L=SHIPS[s];let placed=false;
      for(let a=0;a<200&&!placed;a++){const hz=rnd(2),r=rnd(hz?8:9-L),c=rnd(hz?9-L:8);const cells=[];
        for(let k=0;k<L;k++)cells.push(hz?r*8+c+k:(r+k)*8+c);
        if(cells.every(x=>!near(f,x))){cells.forEach(x=>f[x]=SL[s]);placed=true;}}
      if(!placed)ok=false;}
    if(ok)return f.join('');}
  return '.'.repeat(64);
}
const seaReady=(p,d)=>!!(p&&p.gid===d.gid&&p.ready&&p.f);
const allReady=(d,pr)=>d.pl.every((r,s)=>d.out[s]==='1'||seaReady(pr[r],d));
function seaGrid(f,sh,show,click,small){
  const sunk=new Set();
  if(f)for(const L of SL){const cs=[];for(let i=0;i<64;i++)if(f[i]===L)cs.push(i);if(cs.length&&cs.every(i=>sh[i]==='o'))sunk.add(L);}
  let s=`<div class="sea ${small?'small':''}">`;
  for(let i=0;i<64;i++){const c=f?f[i]:'.';const ship=c!=='.'&&(show||sunk.has(c));const st=sh[i];
    const cls=`sc ${ship?'ship':''} ${sunk.has(c)?'sunk':''} ${st==='o'?'hit':st==='x'?'miss':''}`;
    s+=click&&st==='.'?`<button class="${cls} can" data-ga="fire" data-i="${i}"></button>`:`<div class="${cls}"></div>`;}
  return s+'</div>';
}
GAMES.sea={name:'معركة السفن',lbc:'#245F8C',
  icon:`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#3E8FC4"/><path d="M25 0V100M50 0V100M75 0V100M0 25H100M0 50H100M0 75H100" stroke="#5FAEDF" stroke-width="2"/><path d="M8 46H74L84 52L74 60H14Z" fill="#E8746B" stroke="#2D4763" stroke-width="3"/><path d="M22 48l6 5M32 48l6 5M42 48l6 5" stroke="#2D4763" stroke-width="3"/><path d="M72 52l-9-9 4-2-5-7 9 4 1-6 4 8 6-2-3 7 7 3-7 3" fill="#fff"/><circle cx="72" cy="52" r="7" fill="#2D4763"/><circle cx="70" cy="50" r="2" fill="#fff"/><path d="M14 82l8-8M22 82l-8-8" stroke="#2D4763" stroke-width="4" stroke-linecap="round"/></svg>`,
  init:n=>({sh:Array(n).fill('.'.repeat(64)),last:''}),
  privInit:()=>({f:randFleet(),ready:false}),
  canAct:(d,pr)=>allReady(d,pr),
  viewer(d,pr){if(d.win!=null)return null;for(let s=0;s<d.pl.length;s++)if(d.out[s]!=='1'&&!seaReady(pr[d.pl[s]],d))return s;return d.turn;},
  coverMsg:d=>d.last||'',
  status(d,ctx){const pr=ctx.priv;
    if(!allReady(d,pr)){
      if(ctx.local)return `${nameTag(d,ctx.v)}: رتّب سفنك واضغط جاهز`;
      const rd=d.pl.filter((r,s)=>seaReady(pr[r],d)).length;
      return (ctx.v>=0&&seaReady(pr[S.me],d)?'بانتظار الباقين يجهّزون سفنهم':'رتّب سفنك واضغط جاهز')+`<br><small>جاهز ${rd} من ${d.pl.length}</small>`;}
    return (d.last?`<small>${d.last}</small><br>`:'')+turnTxt(d,ctx);},
  winExtra:d=>d.last||'',
  render(d,ctx){
    const pr=ctx.priv;const v=ctx.local?(d.win!=null?(typeof d.win==='number'?d.win:0):ctx.v):ctx.v;
    if(v<0){return `<p class="lbl">بحر ${nm(d,d.turn)}</p>${seaGrid(pr[d.pl[d.turn]]?.f,d.sh[d.turn],false,false)}`;}
    const mine=pr[d.pl[v]];if(!mine)return '<p class="note">جاري التجهيز…</p>';
    if(!allReady(d,pr)){
      return `<p class="lbl">بحرك (${SHIPS.length} سفن)</p>${seaGrid(mine.f,d.sh[v],true,false)}`+
        (seaReady(mine,d)?'<p class="hint">جاهز ✓</p>':`<div class="row"><button class="sm" data-ga="shuffle">وزّعها من جديد</button><button class="sm go" data-ga="ready">جاهز</button></div>`);}
    const myTurn=ctx.my&&d.turn===v;const o=curTarget(d,v);if(o==null)return '';
    const of=pr[d.pl[o]]?pr[d.pl[o]].f:null;
    return `${tabsHTML(d,v,myTurn?'اختر مين تضرب':'شوف بحور الباقين')}<p class="lbl">بحر ${nameTag(d,o)}${myTurn?'، اضغط مربع تضربه':''}</p>${seaGrid(of,d.sh[o],d.win!=null||d.out[o]==='1',myTurn&&d.out[v]!=='1')}<p class="lbl">بحرك</p>${seaGrid(mine.f,d.sh[v],true,false,true)}`;
  },
  click(a,i,d,ctx){
    if(a==='tgt'){S.tgt=i;render();return;}
    if(a==='shuffle'||a==='ready'){const v=ctx.v;if(v==null||v<0)return;const r=d.pl[v];const p=S.priv[r];if(!p||seaReady(p,d))return;
      setPriv(r,a==='shuffle'?{...p,f:randFleet()}:{...p,ready:true});return;}
    if(!ctx.my)return;const t=d.turn,o=curTarget(d,t);if(o==null)return;const f=S.priv[d.pl[o]]&&S.priv[d.pl[o]].f;
    if(!f){toast('انتظر اللاعب');return;}if(d.sh[o][i]!=='.')return;
    const hit=f[i]!=='.';const sh=[...d.sh];sh[o]=setAt(sh[o],i,hit?'o':'x');let last,win=null,out=d.out;
    if(hit){const L=f[i];const sunk=[...f].every((c,k)=>c!==L||sh[o][k]==='o');last=`أصاب ${nm(d,o)}`+(sunk?' وأغرق سفينة! 💥':'! 🎯')+' ويضرب مرة ثانية';
      if([...f].every((c,k)=>c==='.'||sh[o][k]==='o')){out=setAt(out,o,'1');last=`أغرق كل سفن ${nm(d,o)}!`;const al=aliveSeats(d,out);if(al.length===1)win=al[0];}}
    else last=`ضرب بحر ${nm(d,o)} وطاحت في الماء 💦`;
    act({...d,sh,out,last:`${nm(d,t)}: ${last}`,turn:hit?t:nextSeat(d,t,out),win});
  }
};

/* ================= game: guess the person ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const MN=['أحمد','خالد','فهد','سعد','ناصر','عمر','يوسف','سلطان','ماجد','تركي','بدر','حمد'],FN=['سارة','نورة','ريم','هند','لمى','دانة','جود','مها','عبير','لينا','رهف','شهد'];
const HC={black:'#2B2B2B',brown:'#7A4A2A',blond:'#E8C15A',red:'#C8512E',gray:'#B9B9B9'};
const SKIN=['#F6D6B8','#E7B98F','#C9905F','#8E5B3A'],SHIRT=['#5CC08C','#F2A93B','#9C7BD6','#4AB1E8','#E8746B','#3D5A80'],HIJ=['#3D5A80','#9C7BD6','#2D4763','#C76A8A','#5C8D89'];
const PEOPLE=(()=>{const R=mulberry(20261112);const pick=a=>a[Math.floor(R()*a.length)];const out=[];const seen=new Set();
  const make=(m,name)=>{for(let k=0;k<200;k++){const p={m,name,gl:R()<.3,sm:R()<.5,sk:pick(SKIN),shirt:pick(SHIRT)};
      if(m){p.sh=R()<.3;p.hj=false;p.hair=p.sh?'none':pick(['black','brown','blond','red','gray','bald','black']);p.bd=R()<.4;p.mu=p.bd||R()<.35;p.er=false;}
      else{p.hj=R()<.35;p.sh=false;p.hair=p.hj?'none':pick(['black','brown','blond','red','gray']);p.bd=false;p.mu=false;p.er=!p.hj&&R()<.5;p.hjc=pick(HIJ);}
      const sig=[p.m,p.gl,p.sm,p.sh,p.hj,p.hair,p.bd,p.mu,p.er].join();if(!seen.has(sig)){seen.add(sig);return p;}}};
  for(let i=0;i<12;i++){out.push(make(true,MN[i]));out.push(make(false,FN[i]));}return out;})();
function faceSVG(p){
  const hc=HC[p.hair]||'#2B2B2B';let s=`<svg viewBox="0 0 60 66">`;
  s+=`<path d="M8 66C8 52 18 47 30 47S52 52 52 66Z" fill="${p.shirt}" stroke="#2D4763" stroke-width="1.2"/><rect x="25" y="40" width="10" height="9" fill="${p.sk}"/>`;
  if(p.hj)s+=`<path d="M12 30C12 14 20 9 30 9S48 14 48 30C48 40 46 48 52 58H8C14 48 12 40 12 30Z" fill="${p.hjc}" stroke="#2D4763" stroke-width="1.2"/>`;
  if(!p.m&&!p.hj&&p.hair!=='none')s+=`<path d="M15 28C15 12 22 9 30 9S45 12 45 28V50H15Z" fill="${hc}" stroke="#2D4763" stroke-width="1.2"/>`;
  if(p.sh)s+=`<path d="M13 30C13 14 20 9 30 9S47 14 47 30L50 52H10Z" fill="url(#shm)" stroke="#2D4763" stroke-width="1.2"/>`;
  s+=`<ellipse cx="30" cy="30" rx="12" ry="14" fill="${p.sk}" stroke="#2D4763" stroke-width="1.2"/>`;
  if(p.er)s+=`<circle cx="18" cy="35" r="1.8" fill="#F2C14E" stroke="#2D4763" stroke-width=".5"/><circle cx="42" cy="35" r="1.8" fill="#F2C14E" stroke="#2D4763" stroke-width=".5"/>`;
  if(p.m&&p.hair!=='none'&&p.hair!=='bald')s+=`<path d="M18 26C17 14 24 12 30 12S43 14 42 26C40 20 36 18 30 18S20 20 18 26Z" fill="${hc}" stroke="#2D4763" stroke-width="1"/>`;
  if(p.m&&p.hair==='bald')s+=`<path d="M18 30C17 27 18 25 19 24M42 30C43 27 42 25 41 24" stroke="#8b8b8b" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(!p.m&&!p.hj&&p.hair!=='none')s+=`<path d="M18 25C19 15 26 13 31 14S41 17 42 24C36 21 28 22 18 25Z" fill="${hc}"/>`;
  if(p.sh)s+=`<path d="M16 19C20 13 40 13 44 19" stroke="#1d1d1d" stroke-width="2.6" fill="none"/><path d="M17 22C21 17 39 17 43 22" stroke="#1d1d1d" stroke-width="2" fill="none"/>`;
  s+=`<circle cx="25" cy="29" r="1.6" fill="#2D4763"/><circle cx="35" cy="29" r="1.6" fill="#2D4763"/>`;
  if(p.gl)s+=`<circle cx="25" cy="29" r="4.2" fill="none" stroke="#2D4763" stroke-width="1.3"/><circle cx="35" cy="29" r="4.2" fill="none" stroke="#2D4763" stroke-width="1.3"/><path d="M29.2 29H30.8" stroke="#2D4763" stroke-width="1.3"/>`;
  const bc=p.hair==='gray'||p.hair==='bald'?'#7d7d7d':(p.hair==='none'?'#2B2B2B':hc);
  if(p.bd)s+=`<path d="M18 31C18 44 24 45 30 45S42 44 42 31C40 38 36 39 30 39S20 38 18 31Z" fill="${bc}" stroke="#2D4763" stroke-width=".8"/>`;
  if(p.mu)s+=`<path d="M24 36.5C27 34.5 33 34.5 36 36.5C33 36 27 36 24 36.5Z" fill="${bc}" stroke="${bc}" stroke-width="1.6" stroke-linejoin="round"/>`;
  s+=p.sm?`<path d="M26 38.5Q30 42 34 38.5" stroke="#2D4763" stroke-width="1.3" fill="none" stroke-linecap="round"/>`:`<path d="M27 39.5H33" stroke="#2D4763" stroke-width="1.3" stroke-linecap="round"/>`;
  return s+'</svg>';
}
const FACES=PEOPLE.map(faceSVG);
const QS=[['رجل',p=>p.m],['امرأة',p=>!p.m],['شماغ',p=>p.sh],['حجاب',p=>p.hj],['نظارة',p=>p.gl],['لحية',p=>p.bd],['شنب',p=>p.mu],['مبتسم',p=>p.sm],['شعر أسود',p=>p.hair==='black'],['شعر بني',p=>p.hair==='brown'],['شعر أشقر',p=>p.hair==='blond'],['شعر أحمر',p=>p.hair==='red'],['شعر رمادي',p=>p.hair==='gray'],['أصلع',p=>p.hair==='bald'],['حلق',p=>p.er]];
const pc=(i,cls,attrs)=>`<${attrs?'button':'div'} class="pc ${cls}" ${attrs||''}>${FACES[i]}${PEOPLE[i].name}</${attrs?'button':'div'}>`;
const elSeg=(d,a,t)=>d.el[a].slice(t*24,t*24+24);
GAMES.guess={name:'خمّن الشخص',lbc:'#6E4C8B',
  icon:`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#8C5BA8"/>${[[4,4,0],[36,4,1],[68,4,2],[4,36,3],[36,36,4],[68,36,6],[4,68,9],[36,68,10],[68,68,13]].map(([x,y,k])=>`<g transform="translate(${x} ${y}) scale(.47)"><rect width="60" height="66" rx="8" fill="#fff"/>${FACES[k].replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`).join('')}</svg>`,
  init:n=>({el:Array(n).fill('0'.repeat(24*n)),last:''}),
  privInit:()=>({sec:rnd(24)}),
  viewer:d=>d.win!=null?null:d.turn,
  coverMsg:d=>d.last||'',
  status(d,ctx){return (d.last?`<small>${d.last}</small><br>`:'')+turnTxt(d,ctx)+(d.pl.length>2?'<br><small>تخمين صح يطلّع صاحب الشخصية، وتخمين غلط يطلّعك</small>':'');},
  winExtra(d,ctx){const p=ctx.priv;return `${d.last}<br>`+d.pl.map((r,s)=>`${nm(d,s)}: ${p[r]&&p[r].gid===d.gid?PEOPLE[p[r].sec].name:'؟'}`).join('، ');},
  render(d,ctx){
    let v=ctx.local?(d.win!=null?(typeof d.win==='number'?d.win:0):ctx.v):ctx.v;
    const spect=v<0;if(spect)v=d.turn;
    const mine=ctx.priv[d.pl[v]];const myTurn=ctx.my&&d.turn===v;const gm=myTurn&&S.gw;
    const o=curTarget(d,v);if(o==null)return '';
    let s=!spect&&mine&&mine.gid===d.gid?`<div class="secret">${pc(mine.sec,'')}<div><b>شخصيتك السرية</b><br><small class="note">الباقين يحاولون يعرفونها</small></div></div>`:'';
    s+=tabsHTML(d,v,myTurn?'اختر مين تسأل عنه':'لوحتك عن كل لاعب');
    s+=`<p class="lbl" style="text-align:center">شخصية ${nameTag(d,o)}</p>`;
    if(gm)s+=`<p class="hint" style="text-align:center">اضغط على الشخص اللي تتوقعه (لو غلطت تطلع)</p>`;
    const el=elSeg(d,v,o);
    s+=`<div class="gw">${PEOPLE.map((p,i)=>{const out=el[i]==='1';return gm&&!out?pc(i,'pick',`data-ga="guess" data-i="${i}"`):pc(i,out?'out':'');}).join('')}</div>`;
    if(myTurn){
      if(gm)s+=`<div class="row"><button class="sm" data-ga="gmode">رجوع للأسئلة</button></div>`;
      else s+=`<p class="lbl" style="text-align:center">اسأل: هل شخصية ${nm(d,o)} فيها…</p><div class="qs">${QS.map((q,k)=>`<button class="q" data-ga="ask" data-i="${k}">${q[0]}؟</button>`).join('')}</div><div class="row"><button class="big navy" style="width:auto;margin:0" data-ga="gmode">أعرفه! أبي أخمّن</button></div>`;
    }
    return s;
  },
  click(a,i,d,ctx){
    if(a==='tgt'){S.tgt=i;S.gw=false;render();return;}
    if(a==='gmode'){S.gw=!S.gw;render();return;}
    if(!ctx.my)return;const t=d.turn,o=curTarget(d,t);if(o==null)return;const op=S.priv[d.pl[o]];
    if(!op||op.gid!==d.gid){toast('انتظر اللاعب');return;}
    const P=PEOPLE[op.sec];
    if(a==='ask'){const f=QS[i][1];const ans=!!f(P);const el=[...d.el];const seg=[...elSeg(d,t,o)].map((c,k)=>c==='1'||!!f(PEOPLE[k])!==ans?'1':'0').join('');
      el[t]=el[t].slice(0,o*24)+seg+el[t].slice(o*24+24);
      act({...d,el,turn:nextSeat(d,t),last:`${nm(d,t)} سأل عن ${nm(d,o)} «${QS[i][0]}؟» والجواب: ${ans?'نعم ✓':'لا ✗'}`});}
    else if(a==='guess'&&S.gw){S.gw=false;const right=i===op.sec;const out=setAt(d.out,right?o:t,'1');const al=aliveSeats(d,out);
      act({...d,out,win:al.length===1?al[0]:null,turn:nextSeat(d,t,out),
        last:right?`${nm(d,t)} عرف شخصية ${nm(d,o)}: ${P.name} 🎉`:`${nm(d,t)} خمّن ${PEOPLE[i].name} لـ${nm(d,o)} وطلع غلط`});}
  }
};

render();
</script>
