<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ألعابنا</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#EC6158;--blue:#4AB1E8;--redL:#FAD2CE;--blueL:#CDEAFA;--ink:#2D4763;--bg:#E9F1FA;--mut:#7F95AD;--line:#d3e0ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 48px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:disabled{cursor:default}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.top h1{font-size:26px;margin:0;font-weight:800;flex:1;line-height:1.2}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font-size:42px;margin:6px 0 0;font-weight:800}
.hero p{margin:0;color:var(--mut);font-size:18px}
.big{display:block;width:100%;padding:16px 18px;border-radius:22px;font-size:21px;font-weight:800;color:#fff;margin:14px 0;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.big small{display:block;font-size:14px;font-weight:500;opacity:.9}
.red{background:var(--red)} .blue{background:var(--blue)} .navy{background:var(--ink)}
.panel{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 3px 0 var(--line)}
.panel h3{margin:0;font-size:20px} .panel p{margin:2px 0 0;color:var(--mut)}
.panel .big{margin-bottom:4px}
input.code{width:100%;margin-top:10px;font:inherit;font-size:30px;font-weight:800;text-align:center;letter-spacing:10px;padding:8px;border:3px solid var(--line);border-radius:16px;color:var(--ink);text-transform:uppercase;direction:ltr}
input.code:focus{outline:none;border-color:var(--blue)}
.err{color:#c0392b;text-align:center;font-weight:700}
.note{color:var(--mut);text-align:center;font-size:15px}
.link{background:none;color:var(--blue);font-weight:800;font-size:18px;display:block;margin:8px auto;text-decoration:underline}
.roombar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:8px 12px;margin-bottom:12px;box-shadow:0 3px 0 var(--line);font-size:15px}
.roombar .code{font-size:20px;letter-spacing:3px;direction:ltr;display:inline-block}
.roombar .sp{flex:1}
.pill{padding:2px 10px;border-radius:99px;font-weight:700;font-size:14px}
.pill.ok{background:#d8f3e0;color:#25834a}.pill.wait{background:#fff0cf;color:#a46b00}
.pill.r{background:var(--red);color:#fff}.pill.b{background:var(--blue);color:#fff}
.sm{padding:6px 14px;border-radius:12px;background:var(--bg);font-weight:700;font-size:15px}
.sm.go{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:#fff;border-radius:26px;padding:7px;box-shadow:0 4px 0 var(--line);position:relative;display:block;width:100%}
.gcard svg{display:block;width:100%;border-radius:20px}
.gcard .lb{position:absolute;left:14px;right:14px;bottom:14px;border-radius:16px;padding:6px 4px;font-weight:800;font-size:18px;color:#fff;backdrop-filter:blur(2px)}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.pl{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:99px;color:#fff;font-weight:800}
.pl b{font-size:22px}.pl span{font-size:14px;opacity:.95}
.pl.r{background:var(--red)}.pl.b{background:var(--blue)}
.pl.on{outline:3px solid var(--ink);outline-offset:2px}
.vs{color:var(--mut);font-weight:700}
.status{text-align:center;font-size:19px;min-height:34px;margin:6px 0 12px;line-height:1.5}
.status small{color:var(--mut);font-size:15px}
.tr{color:var(--red)}.tb{color:var(--blue)}
.w{font-size:24px;font-weight:800;margin-left:8px}.w.r{color:var(--red)}.w.b{color:var(--blue)}
.mini{display:inline-block;min-width:30px;border-radius:9px;color:#fff;font-weight:800;margin:0 3px;padding:0 6px}
.mini.r{background:var(--red)}.mini.b{background:var(--blue)}
.board{display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.lbl{margin:6px 0;font-weight:700;color:var(--mut)}
.hint{color:#25834a;font-weight:800}
/* cover */
.cover{width:100%;border-radius:26px;padding:34px 20px;text-align:center;color:#fff}
.cover.r{background:var(--red)}.cover.b{background:var(--blue)}
.cover h2{font-size:34px;margin:4px 0}.cover p{margin:4px 0;font-size:17px}
.cover .big{background:#fff;color:var(--ink);margin-top:22px}
.cover .msg{background:rgba(255,255,255,.25);border-radius:14px;padding:8px;margin-bottom:12px;font-weight:700}
/* ttt */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,360px);background:var(--ink);padding:10px;border-radius:24px}
.tc{aspect-ratio:1;background:#fff;border-radius:16px;display:grid;place-items:center;padding:16%}
.tc svg{width:100%;height:100%}
.tc.hl{background:#fff4c9}
.tc:disabled{opacity:1}
/* dots */
svg.dots{width:min(100%,380px);background:#fff;border-radius:24px;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
svg.dots .hit{stroke:transparent;stroke-width:9;cursor:pointer}
svg.dots .hit:hover+.ghost,svg.dots .ghost{stroke:#dde6f0;stroke-width:1.6;stroke-dasharray:2 2;pointer-events:none}
/* snakes */
.sl{position:relative;width:min(100%,440px);aspect-ratio:1;direction:ltr;border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.sl .cells{display:grid;grid-template-columns:repeat(10,1fr);width:100%;height:100%}
.sl .cl{display:flex;align-items:flex-start;justify-content:flex-start;padding:1px 3px;font-size:11px;font-weight:700;color:#b08a55}
.sl .cl.a{background:#FBEFD9}.sl .cl.b{background:#F3D9AE}
.sl svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rail{stroke:#8a5a2b;stroke-width:1.2;stroke-linecap:round}.rung{stroke:#8a5a2b;stroke-width:.9}
.tok{transition:cx .4s,cy .4s}
.dice{width:64px;height:64px;background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.dice svg{width:50px;height:50px}
.dice.roll{animation:sp .35s}
@keyframes sp{from{transform:rotate(-90deg) scale(.7)}to{transform:none}}
.slmsg{min-height:24px;text-align:center;color:var(--ink);font-weight:700}
.start{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mut);font-size:14px}
/* color wars */
.cw{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(100%,400px);background:#4B3A62;padding:9px;border-radius:24px}
.cc{aspect-ratio:1;border-radius:14px;background:#EFE8DD;display:grid;place-items:center;padding:12%}
.cc.r{background:var(--redL)}.cc.b{background:var(--blueL)}
.cc.can{box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}
.cc:disabled{opacity:1}
.cc svg{width:100%;height:100%}
.cc .pop{animation:pop .25s}
@keyframes pop{from{transform:scale(.5)}to{transform:none}}
/* sea */
.sea{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(100%,380px);background:#2F7DB3;padding:6px;border-radius:18px}
.sea.small{width:min(62%,230px);gap:2px;padding:4px;border-radius:12px}
.sc{aspect-ratio:1;background:#4FA3D8;border-radius:5px;position:relative}
.sea.small .sc{border-radius:3px}
.sc.can{background:#5DB0E3;cursor:pointer}
.sc.can:active{background:#fff6}
.sc.ship{background:#9BB1C4}
.sc.sunk{background:#555f6b}
.sc.miss::after{content:'';position:absolute;inset:36%;border-radius:50%;background:#1d5c87}
.sc.hit{background:var(--red)}
.sc.hit::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:70%}
/* guess */
.gw{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:100%;background:#6E4C8B;padding:7px;border-radius:20px}
.pc{background:#fff;border-radius:10px;padding:2px 1px 1px;text-align:center;font-size:11px;font-weight:700;line-height:1.3;transition:opacity .2s}
.pc svg{width:100%;display:block}
.pc.out{opacity:.22;filter:grayscale(1)}
.pc.pick{cursor:pointer;box-shadow:0 0 0 3px #ffd84d}
.pc:disabled{opacity:1}.pc.out:disabled{opacity:.22}
.secret{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 12px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.secret .pc{width:56px;box-shadow:0 0 0 2px #e4daf0}
.qs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.q{background:#fff;border-radius:12px;padding:5px 12px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.q:active{transform:translateY(2px)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:14px;font-weight:700;z-index:9}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="shm" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="2" height="2" fill="#D9473F"/><rect x="2" y="2" width="2" height="2" fill="#D9473F"/></pattern>
</defs></svg>
<div id="app"></div>
<script>
'use strict';
const app=document.getElementById('app');
const PN=['الأحمر','الأزرق'];
const rid=()=>Math.random().toString(36).slice(2,8);
const rnd=n=>Math.floor(Math.random()*n);
const setAt=(s,i,c)=>s.slice(0,i)+c+s.slice(i+1);
const BACK='<svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PERSON='<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="5" fill="#fff"/><path d="M3 23c0-6 4-9 9-9s9 3 9 9z" fill="#fff"/></svg>';

/* ================= state ================= */
const S={mode:null,st:{g:null,s:0,d:null,sc:[0,0]},me:null,code:null,nr:null,opp:null,priv:[null,null],seen:null,roomErr:null,joining:false,gw:false,rolled:false};
const GAMES={};

function newD(g,starter){return {...GAMES[g].init(starter),gid:rid(),st:starter};}
function setGame(g){S.st={...S.st,g,s:S.st.s+1,d:g?newD(g,0):null,sc:[0,0]};S.seen=null;S.gw=false;afterChange();}
function newRound(){const d=S.st.d;const st=d?1-(d.st||0):0;S.st={...S.st,s:S.st.s+1,d:newD(S.st.g,st)};S.seen=null;S.gw=false;afterChange();}
function act(nd){const was=S.st.d&&S.st.d.win!=null;const sc=[...S.st.sc];if(!was&&nd.win!=null&&nd.win!=='d')sc[nd.win]++;S.st={...S.st,s:S.st.s+1,d:nd,sc};afterChange();}
function setPriv(i,p){S.priv[i]=p;afterChange();}
function afterChange(){ensurePriv();publish();render();}
function ensurePriv(){
  const {g,d}=S.st;if(!g||!d)return;const G=GAMES[g];if(!G||!G.privInit)return;
  const idx=S.mode==='local'?[0,1]:(S.me==null?[]:[S.me]);
  for(const i of idx){const p=S.priv[i];if(!p||p.gid!==d.gid)S.priv[i]={...G.privInit(d,i),gid:d.gid};}
}
function publish(){
  save();
  if(S.mode!=='online'||!S.nr)return;
  S.nr.presence({g:S.st.g,s:S.st.s,d:S.st.d,sc:S.st.sc,r:S.me,p:S.me==null?null:S.priv[S.me]}).catch(e=>console.warn('presence',e));
}
const LS='alaabna.v1';
function save(){if(S.mode!=='online'||!S.code)return;try{localStorage.setItem(LS,JSON.stringify({code:S.code,me:S.me,st:S.st,priv:S.priv[S.me]}));}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem(LS)||'null');}catch(e){return null;}}

/* ================= room ================= */
let roomP=null;
function getRoom(){
  if(!roomP)roomP=(async()=>{
    for(let k=0;k<40&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
    if(!(window.claude&&window.claude.use))return null;
    try{return await window.claude.use('room');}catch(e){return null;}
  })();
  return roomP;
}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[rnd(A.length)];return c;}
async function enterRoom(code,me,restore){
  S.joining=true;S.roomErr=null;render();
  const room=await getRoom();
  if(!room){S.joining=false;S.roomErr='اللعب أونلاين يشتغل لما تفتح الصفحة من claude.ai وأنت مسجّل دخول.';render();return;}
  let nr;
  try{nr=await room.join('g-'+code.toLowerCase());}
  catch(e){S.joining=false;S.roomErr='ما قدرت أدخل الغرفة، جرّب مرة ثانية.';render();return;}
  S.mode='online';S.code=code;S.me=me;S.nr=nr;S.joining=false;S.opp=null;S.priv=[null,null];S.seen=null;
  if(restore&&restore.st){S.st=restore.st;S.priv[me]=restore.priv||null;}
  else S.st={g:null,s:me===0?1:0,d:null,sc:[0,0]};
  nr.onPeers(onPeers,()=>{S.roomErr='انقطع الاتصال بالغرفة.';render();});
  afterChange();
}
function onPeers(ch){
  if(S.mode!=='online')return;
  let opp=null,adopt=null;
  for(const p of ch.peers){
    if(p.sameTab||p.kind!=='viewer')continue;
    const pr=p.presence||{};
    if(S.me!=null&&pr.r===1-S.me)opp=pr;
    if(typeof pr.s!=='number')continue;
    const better=pr.s>S.st.s||(pr.s===S.st.s&&pr.r===0&&S.me!==0&&JSON.stringify(pr.d??null)!==JSON.stringify(S.st.d));
    if(better&&(!adopt||pr.s>adopt.s))adopt=pr;
  }
  S.opp=opp;
  if(opp)S.priv[1-S.me]=opp.p??null;
  if(adopt){
    const oldGid=S.st.d&&S.st.d.gid,oldG=S.st.g;
    S.st={g:adopt.g??null,s:adopt.s,d:adopt.d??null,sc:Array.isArray(adopt.sc)?adopt.sc:[0,0]};
    if(S.st.g!==oldG||(S.st.d&&S.st.d.gid)!==oldGid)S.gw=false;
    ensurePriv();publish();
  }
  render();
}

/* ================= helpers ================= */
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
function mkCtx(){
  const d=S.st.d,G=GAMES[S.st.g],local=S.mode==='local';
  const v=local?(G.viewer?G.viewer(d,S.priv):d.turn):S.me;
  const extra=G.canAct?G.canAct(d,S.priv):true;
  return {local,me:local?null:S.me,v,priv:S.priv,my:d.win==null&&extra&&(local||(d.turn===S.me&&!!S.opp))};
}
function turnTxt(d,ctx){
  if(ctx.local)return `دور <b class="${d.turn?'tb':'tr'}">${PN[d.turn]}</b>`;
  return d.turn===S.me?'<b>دورك</b>':`دور الخصم <span class="${d.turn?'tb':'tr'}">(${PN[d.turn]})</span>`;
}
function statusHTML(d,G,ctx){
  if(d.win!=null){
    const t=d.win==='d'?'تعادل!':(ctx.local?`فاز ${PN[d.win]}!`:(d.win===S.me?'فزت! 🎉':`فاز ${PN[d.win]}`));
    return `<span class="w ${d.win===0?'r':d.win===1?'b':''}">${t}</span> <button class="sm go" data-a="again">جولة جديدة</button>`+(G.winExtra?`<br><small>${G.winExtra(d,ctx)}</small>`:'');
  }
  if(S.mode==='online'&&!S.opp)return 'بانتظار دخول الخصم للغرفة…';
  return G.status?G.status(d,ctx):turnTxt(d,ctx);
}

/* ================= screens ================= */
function render(){
  if(S.mode===null)return renderHome();
  if(S.mode==='lobby')return renderLobby();
  if(!S.st.g||!GAMES[S.st.g]||!S.st.d)return renderGrid();
  renderGame();
}
function renderHome(){
  app.innerHTML=`<div class="hero">${LOGO}<h1>ألعابنا</h1><p>ألعاب لاعبين اثنين</p></div>
  <button class="big red" data-a="local">على نفس الجهاز<small>اثنين على جوال واحد</small></button>
  <button class="big blue" data-a="lobby">أونلاين<small>كل واحد من جهازه برمز غرفة</small></button>`;
}
function renderLobby(){
  const sv=loadSaved();
  app.innerHTML=`<div class="top"><button class="ib" data-a="home">${BACK}</button><h1>أونلاين</h1></div>
  <div class="panel"><h3>أنشئ غرفة</h3><p>تاخذ رمز وترسله لصاحبك، وتكون أنت الأحمر</p><button class="big red" data-a="create" ${S.joining?'disabled':''}>أنشئ غرفة</button></div>
  <div class="panel"><h3>ادخل غرفة صاحبك</h3><p>اكتب الرمز اللي وصلك</p><input class="code" id="code" maxlength="4" autocomplete="off" placeholder="····"><button class="big blue" data-a="join" ${S.joining?'disabled':''}>ادخل</button></div>
  ${sv&&sv.code?`<button class="link" data-a="resume">ارجع لغرفتك ${sv.code}</button>`:''}
  ${S.joining?'<p class="note">جاري الاتصال…</p>':''}${S.roomErr?`<p class="err">${S.roomErr}</p>`:''}`;
}
function roomBar(){
  if(S.mode!=='online')return '';
  return `<div class="roombar"><span>الغرفة</span><b class="code">${S.code}</b><span class="pill ${S.me?'b':'r'}">أنت ${PN[S.me]}</span><span class="sp"></span><span class="pill ${S.opp?'ok':'wait'}">${S.opp?'الخصم متصل':'بانتظار الخصم'}</span><button class="sm" data-a="copy">نسخ</button></div>`;
}
const ORDER=['ttt','dots','snakes','cw','sea','guess'];
function renderGrid(){
  app.innerHTML=`<div class="top"><button class="ib" data-a="${S.mode==='online'?'leave':'home'}">${BACK}</button><h1>اختر لعبة</h1></div>${roomBar()}
  ${S.mode==='online'?'<p class="note">أي لعبة تختارها تنفتح عند الاثنين</p>':''}
  <div class="grid">${ORDER.map(k=>`<button class="gcard" data-a="pick" data-g="${k}">${GAMES[k].icon}<div class="lb" style="background:${GAMES[k].lbc}">${GAMES[k].name}</div></button>`).join('')}</div>`;
}
function scoreBar(sc,d){
  const lab=i=>S.mode==='online'?(S.me===i?'أنت':'الخصم'):PN[i];
  const on=i=>d.win==null&&d.turn===i?'on':'';
  return `<div class="score"><div class="pl r ${on(0)}">${PERSON}<b>${sc[0]}</b><span>${lab(0)}</span></div><div class="vs">ضد</div><div class="pl b ${on(1)}">${PERSON}<b>${sc[1]}</b><span>${lab(1)}</span></div></div>`;
}
function renderGame(){
  const {g,d,sc}=S.st,G=GAMES[g];const ctx=mkCtx();let body=null;
  if(S.mode==='local'&&G.viewer){
    const v=d.win==null?G.viewer(d,S.priv):null;
    if(v!=null&&S.seen!==v){
      const m=G.coverMsg?G.coverMsg(d):'';
      body=`<div class="cover ${v?'b':'r'}">${m?`<div class="msg">${m}</div>`:''}<p>الجهاز الحين لـ</p><h2>${PN[v]}</h2><p>خل الثاني ما يشوف الشاشة</p><button class="big" data-a="reveal" data-i="${v}">أنا ${PN[v]}، ورّني</button></div>`;
    }
  }
  if(!body){try{body=G.render(d,ctx);}catch(e){console.error(e);body='<p class="err">صار خطأ في عرض اللعبة، اضغط جولة جديدة.</p><button class="sm go" data-a="again">جولة جديدة</button>';}}
  app.innerHTML=`<div class="top"><button class="ib" data-a="grid">${BACK}</button><h1>${G.name}</h1></div>${roomBar()}${scoreBar(sc,d)}<div class="status">${body.startsWith('<div class="cover')?'':statusHTML(d,G,ctx)}</div><div class="board">${body}</div>`;
}

app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-ga]');if(!t||t.disabled)return;
  const i=t.dataset.i!=null?+t.dataset.i:null;
  if(t.dataset.ga){const G=GAMES[S.st.g];if(G&&S.st.d)G.click(t.dataset.ga,i,S.st.d,mkCtx());return;}
  switch(t.dataset.a){

const SHIPS=[4,3,3,2,2],SL='abcde';
function near(f,x){const r=Math.floor(x/8),c=x%8;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8&&f[rr*8+cc]!=='.')return true;}return false;}
function randFleet(){
  for(let tr=0;tr<500;tr++){const f=Array(64).fill('.');let ok=true;
    for(let s=0;s<SHIPS.length&&ok;s++){const L=SHIPS[s];let placed=false;
      for(let a=0;a<200&&!placed;a++){const hz=rnd(2),r=rnd(hz?8:9-L),c=rnd(hz?9-L:8);const cells=[];
        for(let k=0;k<L;k++)cells.push(hz?r*8+c+k:(r+k)*8+c);
        if(cells.every(x=>!near(f,x))){cells.forEach(x=>f[x]=SL[s]);placed=true;}}
      if(!placed)ok=false;}
    if(ok)return f.join('');}
  return '.'.repeat(64);

  },
  click(a,i,d,ctx){
    if(a==='shuffle'||a==='ready'){const v=ctx.local?ctx.v:S.me;const p=S.priv[v];if(!p||seaReady(p,d))return;
      setPriv(v,a==='shuffle'?{...p,f:randFleet()}:{...p,ready:true});return;}
    if(!ctx.my)return;const t=d.turn,o=1-t;const f=S.priv[o]&&S.priv[o].f;
    if(!f){toast('انتظر الخصم');return;}if(d.sh[o][i]!=='.')return;
    const hit=f[i]!=='.';const sh=[...d.sh];sh[o]=setAt(sh[o],i,hit?'o':'x');let last,win=null;
    if(hit){const L=f[i];const sunk=[...f].every((c,k)=>c!==L||sh[o][k]==='o');last=sunk?'أغرق سفينة! ويضرب مرة ثانية 💥':'إصابة! ويضرب مرة ثانية 🎯';
      if([...f].every((c,k)=>c==='.'||sh[o][k]==='o')){win=t;last='أغرق كل السفن!';}}
    else last='ضربته طاحت في الماء 💦';
    act({...d,sh,last:`${PN[t]}: ${last}`,turn:hit?t:o,win});
  }
};

/* ================= game: guess the person ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const MN=['أحمد','خالد','فهد','سعد','ناصر','عمر','يوسف','سلطان','ماجد','تركي','بدر','حمد'],FN=['سارة','نورة','ريم','هند','لمى','دانة','جود','مها','عبير','لينا','رهف','شهد'];
const HC={black:'#2B2B2B',brown:'#7A4A2A',blond:'#E8C15A',red:'#C8512E',gray:'#B9B9B9'};
const SKIN=['#F6D6B8','#E7B98F','#C9905F','#8E5B3A'],SHIRT=['#5CC08C','#F2A93B','#9C7BD6','#4AB1E8','#E8746B','#3D5A80'],HIJ=['#3D5A80','#9C7BD6','#2D4763','#C76A8A','#5C8D89'];
const PEOPLE=(()=>{const R=mulberry(20261112);const pick=a=>a[Math.floor(R()*a.length)];const out=[];const seen=new Set();
  const make=(m,name)=>{for(let k=0;k<200;k++){const p={m,name,gl:R()<.3,sm:R()<.5,sk:pick(SKIN),shirt:pick(SHIRT)};
      if(m){p.sh=R()<.3;p.hj=false;p.hair=p.sh?'none':pick(['black','brown','blond','red','gray','bald','black']);p.bd=R()<.4;p.mu=p.bd||R()<.35;p.er=false;}
      else{p.hj=R()<.35;p.sh=false;p.hair=p.hj?'none':pick(['black','brown','blond','red','gray']);p.bd=false;p.mu=false;p.er=!p.hj&&R()<.5;p.hjc=pick(HIJ);}
      const sig=[p.m,p.gl,p.sm,p.sh,p.hj,p.hair,p.bd,p.mu,p.er].join();if(!seen.has(sig)){seen.add(sig);return p;}}};
  for(let i=0;i<12;i++){out.push(make(true,MN[i]));out.push(make(false,FN[i]));}return out;})();
function faceSVG(p){
  const hc=HC[p.hair]||'#2B2B2B';let s=`<svg viewBox="0 0 60 66">`;
  s+=`<path d="M8 66C8 52 18 47 30 47S52 52 52 66Z" fill="${p.shirt}" stroke="#2D4763" stroke-width="1.2"/><rect x="25" y="40" width="10" height="9" fill="${p.sk}"/>`;
  if(p.hj)s+=`<path d="M12 30C12 14 20 9 30 9S48 14 48 30C48 40 46 48 52 58H8C14 48 12 40 12 30Z" fill="${p.hjc}" stroke="#2D4763" stroke-width="1.2"/>`;
  if(!p.m&&!p.hj&&p.hair!=='none')s+=`<path d="M15 28C15 12 22 9 30 9S45 12 45 28V50H15Z" fill="${hc}" stroke="#2D4763" stroke-width="1.2"/>`;
  if(p.sh)s+=`<path d="M13 30C13 14 20 9 30 9S47 14 47 30L50 52H10Z" fill="url(#shm)" stroke="#2D4763" stroke-width="1.2"/>`;
  s+=`<ellipse cx="30" cy="30" rx="12" ry="14" fill="${p.sk}" stroke="#2D4763" stroke-width="1.2"/>`;
  if(p.er)s+=`<circle cx="18" cy="35" r="1.8" fill="#F2C14E" stroke="#2D4763" stroke-width=".5"/><circle cx="42" cy="35" r="1.8" fill="#F2C14E" stroke="#2D4763" stroke-width=".5"/>`;
  if(p.m&&p.hair!=='none'&&p.hair!=='bald')s+=`<path d="M18 26C17 14 24 12 30 12S43 14 42 26C40 20 36 18 30 18S20 20 18 26Z" fill="${hc}" stroke="#2D4763" stroke-width="1"/>`;
  if(p.m&&p.hair==='bald')s+=`<path d="M18 30C17 27 18 25 19 24M42 30C43 27 42 25 41 24" stroke="#8b8b8b" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(!p.m&&!p.hj&&p.hair!=='none')s+=`<path d="M18 25C19 15 26 13 31 14S41 17 42 24C36 21 28 22 18 25Z" fill="${hc}"/>`;
  if(p.sh)s+=`<path d="M16 19C20 13 40 13 44 19" stroke="#1d1d1d" stroke-width="2.6" fill="none"/><path d="M17 22C21 17 39 17 43 22" stroke="#1d1d1d" stroke-width="2" fill="none"/>`;
  s+=`<circle cx="25" cy="29" r="1.6" fill="#2D4763"/><circle cx="35" cy="29" r="1.6" fill="#2D4763"/>`;
  if(p.gl)s+=`<circle cx="25" cy="29" r="4.2" fill="none" stroke="#2D4763" stroke-width="1.3"/><circle cx="35" cy="29" r="4.2" fill="none" stroke="#2D4763" stroke-width="1.3"/><path d="M29.2 29H30.8" stroke="#2D4763" stroke-width="1.3"/>`;
  const bc=p.hair==='gray'||p.hair==='bald'?'#7d7d7d':(p.hair==='none'?'#2B2B2B':hc);
  if(p.bd)s+=`<path d="M18 31C18 44 24 45 30 45S42 44 42 31C40 38 36 39 30 39S20 38 18 31Z" fill="${bc}" stroke="#2D4763" stroke-width=".8"/>`;
  if(p.mu)s+=`<path d="M24 36.5C27 34.5 33 34.5 36 36.5C33 36 27 36 24 36.5Z" fill="${bc}" stroke="${bc}" stroke-width="1.6" stroke-linejoin="round"/>`;
  s+=p.sm?`<path d="M26 38.5Q30 42 34 38.5" stroke="#2D4763" stroke-width="1.3" fill="none" stroke-linecap="round"/>`:`<path d="M27 39.5H33" stroke="#2D4763" stroke-width="1.3" stroke-linecap="round"/>`;
  return s+'</svg>';
}
const FACES=PEOPLE.map(faceSVG);
const QS=[['رجل',p=>p.m],['امرأة',p=>!p.m],['شماغ',p=>p.sh],['حجاب',p=>p.hj],['نظارة',p=>p.gl],['لحية',p=>p.bd],['شنب',p=>p.mu],['مبتسم',p=>p.sm],['شعر أسود',p=>p.hair==='black'],['شعر بني',p=>p.hair==='brown'],['شعر أشقر',p=>p.hair==='blond'],['شعر أحمر',p=>p.hair==='red'],['شعر رمادي',p=>p.hair==='gray'],['أصلع',p=>p.hair==='bald'],['حلق',p=>p.er]];
const pc=(i,cls,attrs)=>`<${attrs?'button':'div'} class="pc ${cls}" ${attrs||''}>${FACES[i]}${PEOPLE[i].name}</${attrs?'button':'div'}>`;
GAMES.guess={name:'خمّن الشخص',lbc:'#6E4C8B',
  icon:`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#8C5BA8"/>${[[4,4,0],[36,4,1],[68,4,2],[4,36,3],[36,36,4],[68,36,6],[4,68,9],[36,68,10],[68,68,13]].map(([x,y,k])=>`<g transform="translate(${x} ${y}) scale(.47)"><rect width="60" height="66" rx="8" fill="#fff"/>${FACES[k].replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`).join('')}</svg>`,
  init:st=>({el:['0'.repeat(24),'0'.repeat(24)],turn:st,win:null,last:''}),
  privInit:()=>({sec:rnd(24)}),
  viewer:d=>d.win!=null?null:d.turn,
  coverMsg:d=>d.last||'',
  status(d,ctx){return (d.last?`<small>${d.last}</small><br>`:'')+turnTxt(d,ctx);},
  winExtra(d,ctx){const p=ctx.priv;const n=i=>p[i]&&p[i].gid===d.gid?PEOPLE[p[i].sec].name:'؟';return `${d.last}<br>شخصية الأحمر: ${n(0)}، شخصية الأزرق: ${n(1)}`;},
  render(d,ctx){
    const v=ctx.local?(d.win!=null?(d.win==='d'?0:d.win):ctx.v):S.me;const mine=ctx.priv[v];
    const el=d.el[v];const gm=ctx.my&&S.gw;
    let s=mine&&mine.gid===d.gid?`<div class="secret">${pc(mine.sec,'')}<div><b>شخصيتك السرية</b><br><small class="note">خصمك يحاول يعرفها</small></div></div>`:'';
    if(gm)s+=`<p class="hint">اضغط على الشخص اللي تتوقعه (لو غلطت تخسر)</p>`;
    s+=`<div class="gw">${PEOPLE.map((p,i)=>{const out=el[i]==='1';return gm&&!out?pc(i,'pick',`data-ga="guess" data-i="${i}"`):pc(i,out?'out':'');}).join('')}</div>`;
    if(ctx.my){
      if(gm)s+=`<div class="row"><button class="sm" data-ga="gmode">رجوع للأسئلة</button></div>`;
      else s+=`<p class="lbl" style="text-align:center">اسأل: هل شخصية خصمك فيها…</p><div class="qs">${QS.map((q,k)=>`<button class="q" data-ga="ask" data-i="${k}">${q[0]}؟</button>`).join('')}</div><div class="row"><button class="big navy" style="width:auto;margin:0" data-ga="gmode">أعرفه! أبي أخمّن</button></div>`;
    }
    return s;
  },
  click(a,i,d,ctx){
    if(a==='gmode'){S.gw=!S.gw;render();return;}
    if(!ctx.my)return;const t=d.turn;const op=S.priv[1-t];
    if(!op||op.gid!==d.gid){toast('انتظر الخصم');return;}
    const P=PEOPLE[op.sec];
    if(a==='ask'){const f=QS[i][1];const ans=!!f(P);const el=[...d.el];
      el[t]=[...el[t]].map((c,k)=>c==='1'||!!f(PEOPLE[k])!==ans?'1':'0').join('');
      act({...d,el,turn:1-t,last:`${PN[t]} سأل «${QS[i][0]}؟» والجواب: ${ans?'نعم ✓':'لا ✗'}`});}
    else if(a==='guess'&&S.gw){S.gw=false;const right=i===op.sec;
      act({...d,win:right?t:1-t,last:right?`${PN[t]} خمّن صح: ${P.name} 🎉`:`${PN[t]} خمّن ${PEOPLE[i].name} وطلع غلط`});}
  }
};

render();
</script>
