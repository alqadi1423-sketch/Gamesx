name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Copy the games into the app
        working-directory: app
        run: npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk alaabna.apk
          gh release delete app-latest --cleanup-tag -y || true
          gh release create app-latest alaabna.apk --target "${{ github.sha }}" --title "تطبيق ألعابنا" --notes "آخر نسخة من التطبيق (بناء رقم ${{ github.run_number }}). نزّل الملف alaabna.apk وثبّته على جوال أندرويد." --latest
