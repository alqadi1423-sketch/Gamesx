name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# each job asks only for what it needs: the build (npm and Gradle code) never holds a token that can write
permissions: {}

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Copy the games into the app
        working-directory: app
        run: npx cap sync android

      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "::error::The ANDROID_KEYSTORE_B64 secret is missing, see SETUP.md"; exit 1; fi
          # spaces, line breaks or quotes picked up while pasting the secret are dropped before decoding
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/alaabna-release.jks" || true
          # sizes and a short fingerprint only (nothing secret), so a wrong paste can be told apart from a wrong password
          echo "secret length: $(printf '%s' "$ANDROID_KEYSTORE_B64" | wc -c), cleaned: $(printf '%s' "$ANDROID_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | wc -c), key file: $(wc -c < "$RUNNER_TEMP/alaabna-release.jks") bytes, sha256 $(sha256sum "$RUNNER_TEMP/alaabna-release.jks" | cut -c1-16)"
          if ! keytool -list -keystore "$RUNNER_TEMP/alaabna-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/kt.err"; then
            echo "::error::The signing key does not open: $(head -c 300 "$RUNNER_TEMP/kt.err"). Check that ANDROID_KEYSTORE_B64 holds the whole text of the key file, and the password and alias secrets, see SETUP.md"; exit 1; fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/alaabna-release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: apk
    runs-on: ubuntu-latest
    # never cut short halfway through swapping the APK
    concurrency:
      group: android-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: "آخر نسخة من التطبيق (بناء رقم ${{ github.run_number }}). نزّل الملف alaabna.apk وثبّته على جوال أندرويد. إذا رفض الجوال يثبّتها فوق النسخة القديمة، احذف التطبيق القديم أول وبعدين ثبّتها."
        run: |
          set -e
          mv app-release.apk alaabna.apk
          if ! gh api "repos/$GH_REPO/releases/tags/app-latest" --silent 2>/dev/null; then
            gh release create app-latest alaabna.apk --target "$GITHUB_SHA" --title "تطبيق ألعابنا" --notes "$NOTES" --latest
            exit 0
          fi
          # swap the file in place: upload it under a second name, then drop the old one and rename,
          # so the download link keeps working (and keeps the old APK if the upload fails)
          cp alaabna.apk alaabna-new.apk
          gh release upload app-latest alaabna-new.apk --clobber
          asset() { gh api "repos/$GH_REPO/releases/tags/app-latest" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          old=$(asset alaabna.apk)
          new=$(asset alaabna-new.apk)
          [ -n "$new" ]
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"; fi
          gh api -X PATCH "repos/$GH_REPO/releases/assets/$new" -f name=alaabna.apk --silent
          gh release edit app-latest --notes "$NOTES"
          # point the release tag at this build so the page and its source match the APK
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/app-latest" -f sha="$GITHUB_SHA" -F force=true --silent
