name: Guards (app and libraries)

# App permissions on the allowed list, lock files committed, licenses allowed (every PR); known vulnerabilities in the
# app's libraries when they change and once a month (docs/rules.md: libraries are checked monthly).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/guards/check-app.js
      - name: Did the libraries change?
        id: libs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then echo "audit=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --name-only "$BASE" HEAD | grep -qE '(^|/)package(-lock)?\.json$'; then echo "audit=1" >> "$GITHUB_OUTPUT"; fi
      - name: Known vulnerabilities (app)
        if: steps.libs.outputs.audit == '1'
        working-directory: app
        run: npm audit --audit-level=high
