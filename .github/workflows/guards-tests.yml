name: Guards (game tests)

# The games a change touches play on one phone (2, 3 and 8 players, and against bots) and, when they hide something,
# online with 4 phones and the leak check (docs/rules.md). New or changed tests run 50 times.
# The full nightly run over every game is manual (workflow_dispatch) until its duration is measured: see docs/review-guards.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: 'Run every game (the measured nightly run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guards-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-tests:
    name: game tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Which games changed
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ]; then node tools/guards/changed-games.js --all > "$RUNNER_TEMP/g.json"
          elif [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then node tools/guards/changed-games.js --base="$BASE" > "$RUNNER_TEMP/g.json"
          else echo '{"smoke":[],"online":[],"why":["no base commit"]}' > "$RUNNER_TEMP/g.json"; fi
          node -e "const g=require('$RUNNER_TEMP/g.json');console.log(g.why.join('\n'));console.log('smoke:',g.smoke.join(',')||'-');console.log('online:',g.online.join(',')||'-')"
          echo "smoke=$(node -p "require('$RUNNER_TEMP/g.json').smoke.join(',')")" >> "$GITHUB_OUTPUT"
          echo "online=$(node -p "require('$RUNNER_TEMP/g.json').online.join(',')")" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "tests=$(git diff --name-only "$BASE" HEAD | grep -E '^tools/(test/|guards/(selftest|test-))' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"; fi
      - name: Test tools
        if: steps.pick.outputs.smoke != '' || steps.pick.outputs.tests != ''
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          npx --prefix tools playwright install --with-deps chromium
      - name: One phone and bots (p2, p3, p8, b13)
        if: steps.pick.outputs.smoke != ''
        env:
          GAMES: ${{ steps.pick.outputs.smoke }}
        run: |
          node tools/test/smoke.js --games="$GAMES" --configs=p2,p3,p8,b13 --workers=2 --out="$RUNNER_TEMP/smoke.json" | tee "$RUNNER_TEMP/smoke.log"
          node -e "const r=require('$RUNNER_TEMP/smoke.json');const a=r.filter(x=>x.errors.length||x.stuck.length||x.inv.length);console.log(r.length+' runs, '+a.length+' failing');for(const x of a)console.log(' ',x.game,x.cfg,'seed='+x.seed,'err='+x.errors.length,'stuck='+x.stuck.length,'inv='+x.inv.length);process.exit(a.length?1:0)"
      - name: Online with 4 phones and the leak check
        if: steps.pick.outputs.online != ''
        env:
          GAMES: ${{ steps.pick.outputs.online }}
        run: |
          node tools/test/online/tfull.js 18977 "$GAMES" 4 150 | tee "$RUNNER_TEMP/tfull.log"
          grep -q 'TFULL OK' "$RUNNER_TEMP/tfull.log"
      - name: New or changed tests, 50 runs each
        if: steps.pick.outputs.tests != ''
        env:
          TESTS: ${{ steps.pick.outputs.tests }}
        run: |
          for t in $TESTS; do
            [ -f "$t" ] || continue
            case "$t" in
              tools/guards/selftest*|tools/guards/test-*) node tools/guards/repeat.js --n=50 -- node "$t" ;;
              tools/test/smoke.js) node tools/guards/repeat.js --n=50 -- node tools/test/smoke.js --games=ttt --configs=p2 --workers=1 ;;
              tools/test/online/*) node tools/guards/repeat.js --n=50 -- node tools/test/online/tfull.js 18978 ttt 4 60 ;;
            esac
          done
