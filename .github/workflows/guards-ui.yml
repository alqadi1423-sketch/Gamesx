name: Guards (interface)

# No new place writes raw HTML, a player's text is always escaped, and no new left/right in the styles (docs/rules.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: interface rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/guards/check-ui.js
