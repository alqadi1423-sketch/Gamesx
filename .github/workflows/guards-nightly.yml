name: Guards (nightly)

# Every playable game (STOPPED ones are left out) on one phone (p2, p3, p8, b13) and, when it hides something, online
# with 4 phones and the leak check. Split over 8 parallel jobs; each must stay under half of the 6-hour job limit.
on:
  workflow_dispatch:
  push:
    branches: [claude/guards-nightly]   # one measured run before merging; removed after the measurement

permissions:
  contents: read

concurrency:
  group: guards-nightly
  cancel-in-progress: false

jobs:
  shard:
    name: nightly ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Test tools
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          npx --prefix tools playwright install --with-deps chromium
      - name: This shard's games
        id: pick
        env:
          K: ${{ matrix.shard }}
        run: |
          node tools/guards/changed-games.js --all --shard="$K" --shards=8 > "$RUNNER_TEMP/g.json"
          echo "smoke=$(node -p "require('$RUNNER_TEMP/g.json').smoke.join(',')")" >> "$GITHUB_OUTPUT"
          echo "online=$(node -p "require('$RUNNER_TEMP/g.json').online.join(',')")" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: One phone and bots (p2, p3, p8, b13)
        env:
          GAMES: ${{ steps.pick.outputs.smoke }}
        run: |
          node tools/test/smoke.js --games="$GAMES" --configs=p2,p3,p8,b13 --workers=2 --out="$RUNNER_TEMP/smoke.json" > "$RUNNER_TEMP/smoke.log"
          tail -3 "$RUNNER_TEMP/smoke.log"
          node -e "const r=require('$RUNNER_TEMP/smoke.json');const a=r.filter(x=>x.errors.length||x.stuck.length||x.inv.length);console.log(r.length+' runs, '+a.length+' failing');for(const x of a)console.log(' ',x.game,x.cfg,'seed='+x.seed,'err='+x.errors.length,'stuck='+x.stuck.length,'inv='+x.inv.length);process.exit(a.length?1:0)"
      - name: Online with 4 phones and the leak check
        if: always() && steps.pick.outputs.online != ''
        env:
          GAMES: ${{ steps.pick.outputs.online }}
        run: |
          node tools/test/online/tfull.js 18977 "$GAMES" 4 150 > "$RUNNER_TEMP/tfull.log" 2>&1 || true
          grep -E 'FAIL|TFULL' "$RUNNER_TEMP/tfull.log" | head -40
          grep -q 'TFULL OK' "$RUNNER_TEMP/tfull.log"
      - name: Duration
        if: always()
        env:
          T0: ${{ steps.pick.outputs.started }}
        run: echo "shard ${{ matrix.shard }} took $(( ($(date +%s) - T0) / 60 )) min"
